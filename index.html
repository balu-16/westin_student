<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      id="portal-default-description"
      name="description"
      content="Student Portal — your academic life, simplified. Timetable, attendance, assignments and announcements in one place."
    />
    <meta name="theme-color" content="#3ba7f2" />
    <!-- iOS home-screen web app: required for web push on iPhone (iOS 16.4+, installed via Share → Add to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Westin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Student Portal — Your Academic Life, Simplified</title>

    <!-- OneSignal Web Push (Custom Code setup — no auto-prompt; permission is requested
         only AFTER login via the post-login banner / Settings toggle, see src/lib/onesignal.ts).
         App is separate from the faculty portal's because origins cannot share a OneSignal app. -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        await OneSignal.init({
          appId: "53e2a6fc-6850-43f0-bb4f-aa60881a49e0",
          allowLocalhostAsSecureOrigin: true,
          notifyButton: { enable: false },
          promptOptions: { slidedown: { prompts: [] } },
          welcomeNotification: { disable: true },
          autoResubscribe: false,
        });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
