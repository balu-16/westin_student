<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Student Portal — your academic life, simplified. Timetable, attendance, assignments and announcements in one place."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Student Portal — Your Academic Life, Simplified</title>

    <!-- OneSignal Web Push (Custom Code setup — no auto-prompt; permission is requested
         from code right after login, see src/lib/onesignal.ts). App is separate from the
         faculty portal's because origins cannot share a OneSignal app. -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        await OneSignal.init({
          appId: "53e2a6fc-6850-43f0-bb4f-aa60881a49e0",
          allowLocalhostAsSecureOrigin: true,
          notifyButton: { enable: false },
          promptOptions: { slidedown: { prompts: [] } },
          welcomeNotification: { disable: true },
          autoResubscribe: false,
        });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
