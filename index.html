<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      id="portal-default-description"
      name="description"
      content="Student Portal — your academic life, simplified. Timetable, attendance, assignments and announcements in one place."
    />
    <meta name="theme-color" content="#3ba7f2" />
    <!-- iOS home-screen web app: required for web push on iPhone (iOS 16.4+, installed via Share → Add to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Westin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Discover landing-page LCP resources before the SPA renders, without
      // downloading homepage artwork on login or private deep links.
      if (location.pathname === "/") {
        const headingFont = document.createElement("link");
        headingFont.rel = "preload";
        headingFont.as = "font";
        headingFont.type = "font/woff2";
        headingFont.crossOrigin = "anonymous";
        headingFont.href = "/fonts/bricolage-latin.woff2";
        document.head.append(headingFont);
        for (const [media, name, widths, sizes] of [
          [
            "(max-width: 767px)",
            "mobile",
            [480, 720, 960],
            "calc(100vw - 12px)",
          ],
          [
            "(min-width: 768px)",
            "desktop",
            [960, 1440, 1920],
            "(min-width: 1440px) 900px, (min-width: 1024px) 65vw, 100vw",
          ],
        ]) {
          const art = document.createElement("link");
          art.rel = "preload";
          art.as = "image";
          art.media = media;
          art.fetchPriority = "high";
          art.imageSrcset = widths
            .map(
              (width) =>
                `/images/skybook/skybook-${name}-${width}.webp ${width}w`,
            )
            .join(", ");
          art.imageSizes = sizes;
          document.head.append(art);
        }
      }
    </script>
    <title>Student Portal — Your Academic Life, Simplified</title>

    <!-- Push SDK loading belongs to the private portal facade in src/lib/onesignal.ts.
         Public browsing and the login screen never initialize a notification SDK. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
